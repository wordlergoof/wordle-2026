<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=0">
    <title>Wordle 2026</title>
    <style>
        * { box-sizing: border-box; }
        body { background: #e3e3e1; color: #000000; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; margin: 0; padding: 5px; overflow-x: hidden; width: 100vw; min-height: 100vh; }
        header { font-weight: bold; font-size: 1.1rem; border-bottom: 1px solid #d3d6da; width: 100%; text-align: center; padding: 5px 0; margin-bottom: 5px; }
        #game-container { display: none; width: 100%; max-width: 375px; flex-direction: column; align-items: center; }
        .tile { width: 40px; height: 40px; border: 2px solid #d3d6da; display: flex; justify-content: center; align-items: center; font-size: 1.3rem; font-weight: bold; margin: 2px; text-transform: uppercase; }
        .masked-letter { color: transparent !important; }
        .row { display: flex; justify-content: center; width: 100%; }
        .kb-row { display: flex; justify-content: center; width: 100%; margin: 3px 0; }
        .key { background: #d3d6da; flex: 1; height: 55px; margin: 1.5px; border-radius: 4px; display: flex; justify-content: center; align-items: center; font-weight: bold; cursor: pointer; }
        .wide { flex: 1.5; font-size: 0.8rem; }
        [data-s="c"] { background: #6aaa64 !important; color: #ffffff !important; }
        [data-s="p"] { background: #c9b458 !important; color: #ffffff !important; }
        [data-s="a"] { background: #787c7e !important; color: #ffffff !important; }
        #start-page, #welcome-back, #congrats-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; padding: 40px 20px; }
        button { padding: 12px 30px; font-weight: bold; border-radius: 30px; border: none; cursor: pointer; margin: 10px; }
        #share-answer-btn { display: none; background-color: #5c9e54; color: #ffffff; }
    </style>
</head>
<body>

<div id="start-page">
    <h1>Wordle</h1>
    <button id="start-play-btn" onclick="startGame()">Play</button>
</div>

<div id="game-container">
    <header id="puzNum"></header>
    <div id="msg"></div>
    <div id="board">
        <!-- Rows 0-5 as defined previously -->
        <div class="row" id="r0"><div class="tile" id="t00"></div><div class="tile" id="t01"></div><div class="tile" id="t02"></div><div class="tile" id="t03"></div><div class="tile" id="t04"></div></div>
        <div class="row" id="r1"><div class="tile" id="t10"></div><div class="tile" id="t11"></div><div class="tile" id="t12"></div><div class="tile" id="t13"></div><div class="tile" id="t14"></div></div>
        <div class="row" id="r2"><div class="tile" id="t20"></div><div class="tile" id="t21"></div><div class="tile" id="t22"></div><div class="tile" id="t23"></div><div class="tile" id="t24"></div></div>
        <div class="row" id="r3"><div class="tile" id="t30"></div><div class="tile" id="t31"></div><div class="tile" id="t32"></div><div class="tile" id="t33"></div><div class="tile" id="t34"></div></div>
        <div class="row" id="r4"><div class="tile" id="t40"></div><div class="tile" id="t41"></div><div class="tile" id="t42"></div><div class="tile" id="t43"></div><div class="tile" id="t44"></div></div>
        <div class="row" id="r5"><div class="tile" id="t50"></div><div class="tile" id="t51"></div><div class="tile" id="t52"></div><div class="tile" id="t53"></div><div class="tile" id="t54"></div></div>
    </div>
    <button id="share-answer-btn" onclick="shareAnswer()">Share Answer</button>
</div>

<script>
// ... [Existing game state variables r, c, g, done, win, ems, ans] ...

function shareAnswer() {
    var scoreText = win ? (r - 1) : "X";
    var text = "Wordle #" + todayData.num + " " + scoreText + "/6\n\n";
    
    for (let i = 0; i < ems.length; i++) {
        // Logic: Mask previous turns, reveal only the winning row
        if (win && i === (r - 1)) {
            let letterRow = "";
            for (let char of ans) {
                letterRow += "[" + char.toUpperCase() + "]";
            }
            text += letterRow + "\n";
        } else {
            text += "⬛⬛⬛⬛⬛\n";
        }
    }

    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => {
            alert('Copied to clipboard!');
        });
    }
}
</script>
</body>
</html>
