<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=0">
    <title>Wordle 2026</title>
    <style>
        * { box-sizing: border-box; }
        body { background: #e3e3e1; color: #000000; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; margin: 0; padding: 5px; min-height: 100vh; }
        #game-container { display: none; width: 100%; max-width: 375px; flex-direction: column; align-items: center; }
        .tile { width: 40px; height: 40px; border: 2px solid #d3d6da; display: flex; justify-content: center; align-items: center; font-size: 1.3rem; font-weight: bold; margin: 2px; text-transform: uppercase; }
        .row { display: flex; justify-content: center; width: 100%; }
        #start-page { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 80vh; }
        #start-play-btn { background-color: #121213; color: #ffffff; border: none; padding: 14px 60px; font-size: 1.1rem; font-weight: bold; border-radius: 30px; cursor: pointer; }
    </style>
</head>
<body>

<div id="start-page">
    <div class="start-title" style="font-size: 3rem; font-weight: bold;">Wordle</div>
    <button id="start-play-btn" onclick="startGame()">Play</button>
</div>

<div id="game-container">
    <header id="puzNum"></header>
    <div id="board">
        <!-- Rows 0-5 -->
        <div class="row" id="r0"><div class="tile" id="t00"></div><div class="tile" id="t01"></div><div class="tile" id="t02"></div><div class="tile" id="t03"></div><div class="tile" id="t04"></div></div>
        <div class="row" id="r1"><div class="tile" id="t10"></div><div class="tile" id="t11"></div><div class="tile" id="t12"></div><div class="tile" id="t13"></div><div class="tile" id="t14"></div></div>
        <div class="row" id="r2"><div class="tile" id="t20"></div><div class="tile" id="t21"></div><div class="tile" id="t22"></div><div class="tile" id="t23"></div><div class="tile" id="t24"></div></div>
        <div class="row" id="r3"><div class="tile" id="t30"></div><div class="tile" id="t31"></div><div class="tile" id="t32"></div><div class="tile" id="t33"></div><div class="tile" id="t34"></div></div>
        <div class="row" id="r4"><div class="tile" id="t40"></div><div class="tile" id="t41"></div><div class="tile" id="t42"></div><div class="tile" id="t43"></div><div class="tile" id="t44"></div></div>
        <div class="row" id="r5"><div class="tile" id="t50"></div><div class="tile" id="t51"></div><div class="tile" id="t52"></div><div class="tile" id="t53"></div><div class="tile" id="t54"></div></div>
    </div>
</div>

<script>
    var ans = "LEGAL"; // Default fallback
    var todayNum = 1854;

    async function initGame() {
        try {
            // Adding a timestamp prevents browser caching old/broken versions
            const response = await fetch('words.json?v=' + new Date().getTime());
            if (!response.ok) throw new Error("Could not load words");
            
            const wordList = await response.json();
            const dt = new Date();
            const dateKey = dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0') + '-' + String(dt.getDate()).padStart(2, '0');
            
            if (wordList[dateKey]) {
                ans = wordList[dateKey].word;
                todayNum = wordList[dateKey].num;
            }
        } catch (e) {
            console.warn("Falling back to default word due to error:", e);
        }
        document.getElementById("puzNum").textContent = "WORDLE #" + todayNum;
    }

    function startGame() {
        document.getElementById('start-page').style.display = 'none';
        document.getElementById('game-container').style.display = 'flex';
    }

    // Initialize immediately
    initGame();
</script>

</body>
</html>
